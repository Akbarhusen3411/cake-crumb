<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Facebook cover — Cake &amp; Crumb</title>
<!--
  Facebook cover, drawn at 820 × 312 CSS px (Facebook's desktop display size)
  and exported at 2× → 1640 × 624 PNG.
  Phones crop the sides to 16:9, keeping only the middle ~555 px (x 132–688),
  so the name and number sit inside that band; the outer photos are allowed to go.
  Export:
    chrome --headless=new --hide-scrollbars --virtual-time-budget=6000
      --force-device-scale-factor=2 --window-size=820,312
      --screenshot=social/facebook-cover-tagline.png file:///…/social/facebook-cover.html
  Contact details are hand-copied — update them if the number changes.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Allura&family=Lato:wght@400;700&family=Playfair+Display:ital,wght@0,700;1,500&display=block" rel="stylesheet">
<style>
  :root {
    --rose: #e0617a; --rose-ink: #ad2f4e; --blush: #f3d7d9;
    --cream: #fff6f2; --cocoa: #5b3e36; --cocoa-soft: #7a584d;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 820px; height: 312px; overflow: hidden; background: var(--cream); }
  .cover {
    position: relative; width: 820px; height: 312px; overflow: hidden;
    background:
      radial-gradient(circle at 50% 45%, #fffaf8 0 32%, transparent 62%),
      radial-gradient(circle at 0% 100%, #f7e3df 0 25%, transparent 50%),
      radial-gradient(circle at 100% 0%, #f7e3df 0 25%, transparent 50%),
      var(--cream);
    font-family: 'Lato', sans-serif; color: var(--cocoa);
  }
  /* faint dot texture */
  .cover::before {
    content: ''; position: absolute; inset: 0;
    background-image: radial-gradient(rgba(224,97,122,.13) 1px, transparent 1.4px);
    background-size: 14px 14px;
  }
  .ph {
    position: absolute; overflow: hidden;
    border: 5px solid #fff; border-radius: 999px 999px 18px 18px;
    box-shadow: 0 0 0 1.5px var(--rose), 0 10px 22px rgba(91,62,54,.22);
    background: #fff;
  }
  .ph img { width: 100%; height: 100%; object-fit: cover; display: block; }
  /* outer pair — decorative, cropped away on phones */
  .ph--o1 { left: 14px;  top: 70px; width: 112px; height: 178px; transform: rotate(-5deg); }
  .ph--o2 { right: 14px; top: 70px; width: 112px; height: 178px; transform: rotate(5deg); }
  /* inner pair — inside the phone-safe band */
  .ph--i1 { left: 136px;  top: 42px; width: 100px; height: 200px; transform: rotate(-2deg); }
  .ph--i2 { right: 136px; top: 42px; width: 100px; height: 200px; transform: rotate(2deg); }

  .centre {
    position: absolute; left: 242px; width: 336px; top: 0; bottom: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center;
  }
  .mast { display: flex; align-items: center; gap: 8px; }
  .mast img { height: 48px; width: auto; }
  .word { display: flex; flex-direction: column; align-items: center; line-height: 1; }
  .name {
    font-family: 'Playfair Display', serif; font-weight: 700; font-size: 25px;
    letter-spacing: .04em; color: #1a1a1a; white-space: nowrap;
  }
  .name i { font-style: italic; font-weight: 500; font-size: 1.3em; color: var(--rose); margin: 0 .03em; vertical-align: -.06em; }
  .sub { font-family: 'Allura', cursive; font-size: 16px; white-space: nowrap; color: var(--rose-ink); margin-top: 4px; }

  .heart { display: flex; align-items: center; gap: 8px; margin: 10px 0 9px; color: var(--rose); }
  .heart span { width: 54px; height: 1.5px; background: var(--rose); opacity: .7; }
  .heart svg { width: 12px; height: 12px; }

  .chips { display: flex; gap: 5px; justify-content: center; flex-wrap: nowrap; }
  .chip {
    font-size: 10.5px; font-weight: 700; letter-spacing: .02em; color: var(--cocoa);
    background: var(--blush); border-radius: 999px; padding: 4px 9px; white-space: nowrap;
  }
  .wa {
    margin-top: 12px; display: inline-flex; align-items: center; gap: 7px;
    background: var(--rose-ink); color: #fff; border-radius: 999px; padding: 6px 15px 6px 8px;
    font-size: 13px; font-weight: 700; letter-spacing: .02em;
    box-shadow: 0 6px 14px rgba(173,47,78,.28);
  }
  .wa b { display: grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; background: #fff; }
  .wa svg { width: 14px; height: 14px; }
  .loc { margin-top: 8px; font-size: 10.5px; color: var(--cocoa-soft); letter-spacing: .08em; text-transform: uppercase; }
</style>
</head>
<body>
<div class="cover">
  <div class="ph ph--o1"><img src="../public/products/cupcakes-floral-rose-box.webp" alt=""></div>
  <div class="ph ph--i1"><img src="../public/products/cake-heart-ma-pink-roses.webp" alt=""></div>
  <div class="ph ph--i2"><img src="../public/products/cheesecake-strawberry-rose.webp" alt=""></div>
  <div class="ph ph--o2"><img src="../public/products/cake-red-velvet-hearts.webp" alt=""></div>

  <div class="centre">
    <div class="mast">
      <img src="../public/logo_final.png" alt="">
      <div class="word">
        <div class="name">CAKE<i>&amp;</i>CRUMB</div>
        <div class="sub">The gourmet chocolate and berry boutique!</div>
      </div>
    </div>
    <div class="heart"><span></span>
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 21s-7.5-4.6-10-9.3C.4 8.4 2.3 4 6.3 4c2.3 0 3.9 1.3 5.7 3.3C13.8 5.3 15.4 4 17.7 4c4 0 5.9 4.4 4.3 7.7C19.5 16.4 12 21 12 21z"/></svg>
    <span></span></div>
    <div class="chips">
      <span class="chip">Made to order</span>
      <span class="chip">Eggless on request</span>
      <span class="chip">Custom designs</span>
    </div>
    <div class="wa"><b><svg viewBox="0 0 24 24" fill="#ad2f4e"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2c-1.5 0-3-.4-4.3-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.2-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2c0 1.3.9 2.5 1 2.7.1.2 1.8 2.8 4.4 3.9 1.6.7 2.3.8 3.1.6.5-.1 1.5-.6 1.7-1.2.2-.6.2-1.1.2-1.2-.1-.1-.3-.2-.5-.3z"/></svg></b>Order on WhatsApp · +91 91731 83440</div>
    <div class="loc">Homemade cakes &amp; desserts · Vaso, Kheda</div>
  </div>
</div>
</body>
</html>
