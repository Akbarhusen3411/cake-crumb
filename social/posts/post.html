<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Facebook posts — Cake &amp; Crumb</title>
<!--
  Six launch posts for Facebook, one file: post.html?n=1 … ?n=6.
  Drawn at 540 × 675 CSS px (4:5) and exported at 2× → 1080 × 1350 PNG.
  Export from the repo root: node social/posts/export.cjs
  No prices on the images on purpose — a price change never needs a new picture;
  the captions (captions.txt) carry them. Contact details are hand-copied.
-->
<link href="https://fonts.googleapis.com/css2?family=Allura&family=Lato:wght@400;700;900&family=Playfair+Display:ital,wght@0,700;1,500&display=block" rel="stylesheet">
<style>
  :root { --rose:#e0617a; --rose-ink:#ad2f4e; --blush:#f3d7d9; --cream:#fff6f2; --cocoa:#5b3e36; --cocoa-soft:#7a584d; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 540px; height: 675px; overflow: hidden; background: var(--cream); }
  .post { position: relative; width: 540px; height: 675px; overflow: hidden; font-family: 'Lato', sans-serif; color: var(--cocoa);
    background: radial-gradient(circle at 100% 0, #f7e3df 0 22%, transparent 45%), radial-gradient(circle at 0 100%, #f7e3df 0 22%, transparent 45%), var(--cream); }
  .post::before { content:''; position:absolute; inset:0; background-image: radial-gradient(rgba(224,97,122,.12) 1px, transparent 1.4px); background-size: 14px 14px; }
  .frame { position:absolute; inset: 12px; border: 1.5px solid var(--rose); border-radius: 14px; pointer-events: none; opacity: .55; }

  /* photo block */
  .photo { position:absolute; left: 28px; right: 28px; top: 28px; height: 400px; border-radius: 16px; overflow: hidden;
    border: 5px solid #fff; box-shadow: 0 0 0 1.5px var(--rose), 0 12px 26px rgba(91,62,54,.2); background:#fff; }
  .photo img { width:100%; height:100%; object-fit: cover; display:block; }
  .grid { display:grid; grid-template-columns: 1fr 1fr; grid-template-rows: repeat(2, minmax(0, 1fr)); gap: 5px; background: #fff; }
  .grid img { min-height: 0; }
  /* square shot with lettering in its corners: show it whole over a blurred copy of itself */
  .photo--whole img.bg { position: absolute; inset: -20px; width: calc(100% + 40px); height: calc(100% + 40px); filter: blur(18px) brightness(1.05); }
  .photo--whole img.fg { position: relative; object-fit: contain; }
  .tag { position:absolute; left: 44px; top: 412px; background: var(--rose-ink); color:#fff; font-weight:900; font-size: 11px;
    letter-spacing: .14em; text-transform: uppercase; padding: 7px 14px; border-radius: 999px; box-shadow: 0 6px 14px rgba(173,47,78,.3); }

  .text { position:absolute; left: 40px; right: 40px; top: 450px; bottom: 74px; display:flex; flex-direction:column; justify-content:center; }
  h1 { font-family:'Playfair Display', serif; font-weight:700; font-size: 32px; line-height: 1.1; color:#1a1a1a; }
  h1 i { font-style: italic; font-weight: 500; color: var(--rose-ink); }
  .script { font-family:'Allura', cursive; font-size: 30px; color: var(--rose-ink); line-height: 1; margin-bottom: 2px; }
  p.sub { margin-top: 8px; font-size: 14px; line-height: 1.45; color: var(--cocoa-soft); }
  .chips { display:flex; flex-wrap:wrap; gap: 6px; margin-top: 10px; }
  .chip { font-size: 11.5px; font-weight: 700; background: var(--blush); color: var(--cocoa); border-radius: 999px; padding: 5px 11px; }

  .foot { position:absolute; left: 28px; right: 28px; bottom: 24px; height: 40px; display:flex; align-items:center; justify-content:space-between;
    border-top: 1px solid rgba(224,97,122,.35); padding-top: 8px; }
  .brand { display:flex; align-items:center; gap: 7px; }
  .brand img { height: 34px; }
  .brand b { font-family:'Playfair Display', serif; font-weight:700; font-size: 15px; letter-spacing:.04em; color:#1a1a1a; white-space:nowrap; }
  .brand b i { font-style: italic; font-weight: 500; color: var(--rose); font-size: 1.25em; vertical-align: -.05em; }
  .bw { display: flex; flex-direction: column; align-items: center; line-height: 1; }
  .bw s { text-decoration: none; font-family: 'Allura', cursive; font-size: 13px; color: var(--rose-ink); margin-top: 2px; white-space: nowrap; }
  .wa { font-size: 12.5px; font-weight: 900; color: var(--rose-ink); display:flex; align-items:center; gap: 6px; white-space: nowrap; }
  .wa svg { width: 15px; height: 15px; }

  /* steps card (post 6) */
  .steps-head { position:absolute; left:40px; right:40px; top: 56px; text-align:center; }
  .steps { position:absolute; left: 40px; right: 40px; top: 190px; display:flex; flex-direction:column; gap: 13px; }
  .step { display:flex; gap: 14px; align-items:flex-start; background:#fff; border-radius: 14px; padding: 15px 18px;
    box-shadow: 0 0 0 1.5px var(--blush), 0 6px 16px rgba(91,62,54,.08); }
  .step .n { flex: 0 0 34px; height: 34px; border-radius: 50%; background: var(--rose-ink); color:#fff; display:grid; place-items:center;
    font-family:'Playfair Display', serif; font-weight:700; font-size: 18px; }
  .step h2 { font-family:'Playfair Display', serif; font-size: 19.5px; color:#1a1a1a; margin-bottom: 2px; }
  .step p { font-size: 13.5px; line-height: 1.4; color: var(--cocoa-soft); }
  .heart { display:flex; justify-content:center; align-items:center; gap: 8px; color: var(--rose); margin-top: 12px; }
  .heart span { width: 50px; height: 1.5px; background: var(--rose); opacity: .7; }
  .heart svg { width: 11px; height: 11px; }
</style>
</head>
<body>
<div class="post" id="post"></div>
<template id="foot">
  <div class="foot">
    <div class="brand"><img src="../../public/logo_final.png" alt=""><span class="bw"><b>CAKE<i>&amp;</i>CRUMB</b><s>The gourmet chocolate and berry boutique!</s></span></div>
    <div class="wa"><svg viewBox="0 0 24 24" fill="#ad2f4e"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2c-1.5 0-3-.4-4.3-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.2-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2c0 1.3.9 2.5 1 2.7.1.2 1.8 2.8 4.4 3.9 1.6.7 2.3.8 3.1.6.5-.1 1.5-.6 1.7-1.2.2-.6.2-1.1.2-1.2-.1-.1-.3-.2-.5-.3z"/></svg>+91 91731 83440</div>
  </div>
</template>
<script>
  const P = '../../public/products/'
  const HEART = '<div class="heart"><span></span><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 21s-7.5-4.6-10-9.3C.4 8.4 2.3 4 6.3 4c2.3 0 3.9 1.3 5.7 3.3C13.8 5.3 15.4 4 17.7 4c4 0 5.9 4.4 4.3 7.7C19.5 16.4 12 21 12 21z"/></svg><span></span></div>'
  const photo = (f, pos = 'center') => `<div class="photo"><img src="${P}${f}" style="object-position:${pos}" alt=""></div>`
  const POSTS = {
    1: `<div class="photo grid">
          <img src="${P}cake-heart-ma-pink-roses.webp" alt=""><img src="${P}cheesecake-strawberry-rose.webp" alt="">
          <img src="${P}cupcakes-box-pink-purple.webp" alt=""><img src="${P}cake-red-velvet-hearts.webp" alt="">
        </div>
        <div class="tag">Now on Facebook</div>
        <div class="text">
          <div class="script">Hello, Vaso!</div>
          <h1>Homemade cakes <i>&amp;</i> desserts, baked to order</h1>
          <p class="sub">Cheesecakes, cupcakes, cookies, custom cakes and more, fresh from our kitchen in Vaso, Kheda.</p>
        </div>`,
    2: `${photo('cheesecake-quartet.webp')}
        <div class="tag">Cheesecakes</div>
        <div class="text">
          <h1>23 cheesecake flavours, <i>one</i> hard choice</h1>
          <p class="sub">Strawberry, Biscoff, Nutella, Pistachio, Mango and many more.</p>
          <div class="chips"><span class="chip">Banto: the whole cheesecake</span><span class="chip">Tub: a single serving</span></div>
        </div>`,
    3: `${photo('cupcakes-box-pink-purple.webp')}
        <div class="tag">Cupcakes</div>
        <div class="text">
          <h1>A box of six, <i>or</i> just a few</h1>
          <p class="sub">Vanilla, Red Velvet, Chocolate, Pistachio, Biscoff, Nutella, Strawberry and Sprinkle.</p>
          <div class="chips"><span class="chip">Box of 6</span><span class="chip">Or by the piece (2 or more)</span></div>
        </div>`,
    4: `${photo('cake-heart-ma-pink-roses.webp', 'center 40%')}
        <div class="tag">Custom cakes</div>
        <div class="text">
          <h1>Your idea, <i>our</i> oven</h1>
          <p class="sub">Birthdays, anniversaries, Mother’s Day: tell us the occasion, the flavour and the message, and we’ll make it.</p>
          <div class="chips"><span class="chip">Order a day ahead</span><span class="chip">Eggless on request</span></div>
        </div>`,
    5: `<div class="photo photo--whole"><img class="bg" src="${P}birthday-gift-box.webp" alt=""><img class="fg" src="${P}birthday-gift-box.webp" alt=""></div>
        <div class="tag">Birthday Gift Box</div>
        <div class="text">
          <h1>A cake <i>and</i> fresh flowers, in one box</h1>
          <p class="sub">The birthday gift that does it all, and a dessert cup comes free with it.</p>
          <div class="chips"><span class="chip">Cake</span><span class="chip">Fresh flowers</span><span class="chip">+ free dessert cup</span></div>
        </div>`,
    6: `<div class="steps-head">
          <div class="script" style="font-size:34px">Ordering is easy</div>
          <h1 style="font-size:36px">How to order</h1>
          ${HEART}
        </div>
        <div class="steps">
          <div class="step"><div class="n">1</div><div><h2>Pick your treats</h2><p>Browse the menu on our website, or message us on WhatsApp.</p></div></div>
          <div class="step"><div class="n">2</div><div><h2>Choose a date</h2><p>Order a day ahead. Everything is baked fresh after you order.</p></div></div>
          <div class="step"><div class="n">3</div><div><h2>Delivery or pickup</h2><p>Home delivery (charges by distance), or collect it yourself for free.</p></div></div>
          <div class="step"><div class="n">4</div><div><h2>Pay your way</h2><p>UPI or cash. Orders of ₹1,000 or more take a 50% advance.</p></div></div>
        </div>`,
  }
  const n = new URLSearchParams(location.search).get('n') || '1'
  const post = document.getElementById('post')
  post.innerHTML = '<div class="frame"></div>' + POSTS[n]
  post.appendChild(document.getElementById('foot').content.cloneNode(true))
</script>
</body>
</html>
